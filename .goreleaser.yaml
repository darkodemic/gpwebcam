# GoReleaser configuration for gpwebcam.
# Local test build of every package, without publishing anything:
#   goreleaser release --snapshot --clean
# Package layout and dependencies follow
# docs/plans-and-decisions/packaging-and-release.md.
version: 2
project_name: gpwebcam

before:
  hooks:
    # Packages ship man pages compressed; -n leaves out the name and time,
    # so the result is the same on every build.
    - gzip -9 -n -k -f packaging/man/gpwebcam.1

builds:
  - id: gpwebcam
    main: ./cmd/gpwebcam
    binary: gpwebcam
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Reproducible: file times come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: gpwebcam
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - packaging/systemd/gpwebcam.service
      - packaging/modules-load.d/gpwebcam.conf
      - packaging/modprobe.d/99-gpwebcam.conf
      - packaging/man/gpwebcam.1
      - packaging/desktop/gpwebcam.desktop
      - packaging/icons/gpwebcam.svg

# The source archive for the AUR source package; makepkg builds from it.
source:
  enabled: true
  name_template: "{{ .ProjectName }}-{{ .Version }}"
  prefix_template: "{{ .ProjectName }}-{{ .Version }}/"

checksum:
  name_template: checksums.txt

snapshot:
  # A test build sorts before the next release in every package manager
  # (deb and rpm treat "~" as earlier).
  version_template: "{{ incpatch .Version }}~dev.{{ .ShortCommit }}"

nfpms:
  # deb and rpm get a synopsis line and a long description; Arch wants a
  # one-line pkgdesc, so it has its own entry below that reuses this one.
  - &nfpm
    id: gpwebcam
    package_name: gpwebcam
    file_name_template: "{{ .ConventionalFileName }}"
    release: "1"
    # File times from the commit, so pacman -Qkk and rebuilds agree.
    mtime: "{{ .CommitDate }}"
    changelog: packaging/changelog.yml
    vendor: Darko Demić
    homepage: https://github.com/darkodemic/gpwebcam
    maintainer: Darko Demić <mail@darkodemic.com>
    description: |-
      Use a GoPro connected over USB as a Linux webcam
      gpwebcam starts the camera's webcam mode through the Open GoPro HTTP API
      and feeds its video into a v4l2loopback device that browsers, Zoom and
      other video applications use like any other camera. It runs as a
      systemd user service without root.
    license: Apache-2.0
    section: video
    priority: optional
    formats: [deb, rpm]
    bindir: /usr/bin
    dependencies:
      - ffmpeg
      # Owns the icon's directories and refreshes the icon cache.
      - hicolor-icon-theme
    contents:
      - src: packaging/systemd/gpwebcam.service
        dst: /usr/lib/systemd/user/gpwebcam.service
        file_info:
          mode: 0644
      - src: packaging/modules-load.d/gpwebcam.conf
        dst: /usr/lib/modules-load.d/gpwebcam.conf
        file_info:
          mode: 0644
      - src: packaging/modprobe.d/99-gpwebcam.conf
        dst: /usr/lib/modprobe.d/99-gpwebcam.conf
        file_info:
          mode: 0644
      # "GoPro Webcam" in the application menu runs gpwebcam launch.
      - src: packaging/desktop/gpwebcam.desktop
        dst: /usr/share/applications/gpwebcam.desktop
        file_info:
          mode: 0644
      # The application icon, for the menu entry and notifications.
      - src: packaging/icons/gpwebcam.svg
        dst: /usr/share/icons/hicolor/scalable/apps/gpwebcam.svg
        file_info:
          mode: 0644
      # RPM marks documentation as such (rpmlint), so the man page and
      # README appear once per packager.
      - src: packaging/man/gpwebcam.1.gz
        dst: /usr/share/man/man1/gpwebcam.1.gz
        packager: deb
        file_info:
          mode: 0644
      - src: packaging/man/gpwebcam.1.gz
        dst: /usr/share/man/man1/gpwebcam.1.gz
        packager: archlinux
        file_info:
          mode: 0644
      - src: packaging/man/gpwebcam.1.gz
        dst: /usr/share/man/man1/gpwebcam.1.gz
        packager: rpm
        type: doc
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/gpwebcam/README.md
        packager: deb
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/gpwebcam/README.md
        packager: archlinux
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/gpwebcam/README.md
        packager: rpm
        type: doc
        file_info:
          mode: 0644
      # RPM removes only directories the package owns.
      - dst: /usr/share/doc/gpwebcam
        type: dir
        packager: rpm
      - dst: /usr/share/licenses/gpwebcam
        type: dir
        packager: rpm
      # Arch and Fedora keep license texts here; Debian uses a DEP-5
      # copyright file that points to /usr/share/common-licenses.
      - src: LICENSE
        dst: /usr/share/licenses/gpwebcam/LICENSE
        packager: archlinux
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/licenses/gpwebcam/LICENSE
        packager: rpm
        type: license
        file_info:
          mode: 0644
      - src: packaging/deb/copyright
        dst: /usr/share/doc/gpwebcam/copyright
        packager: deb
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/scripts/postinstall.sh
    overrides:
      deb:
        recommends:
          - v4l2loopback-dkms | v4l2loopback-modules
        suggests:
          - v4l2loopback-utils
      rpm:
        # Fedora's ffmpeg-free does not provide the name "ffmpeg".
        dependencies:
          - /usr/bin/ffmpeg
          - hicolor-icon-theme
        recommends:
          - v4l2loopback
    deb:
      # Go builds without cgo are static on purpose.
      lintian_overrides:
        - statically-linked-binary
    rpm:
      summary: Use a GoPro connected over USB as a Linux webcam
    archlinux:
      packager: Darko Demić <mail@darkodemic.com>
  - <<: *nfpm
    id: gpwebcam-arch
    formats: [archlinux]
    description: Use a GoPro connected over USB as a Linux webcam

# AUR: gpwebcam-bin from the release archives, gpwebcam built from the
# tagged source. Both are pushed with the key in the AUR_KEY secret.
aurs:
  -
    name: gpwebcam-bin
    ids: [gpwebcam]
    homepage: https://github.com/darkodemic/gpwebcam
    description: Use a GoPro connected over USB as a Linux webcam
    maintainers:
      - "Darko Demić <mail at darkodemic dot com>"
    license: Apache-2.0
    private_key: '{{ envOrDefault "AUR_KEY" "" }}'
    git_url: ssh://aur@aur.archlinux.org/gpwebcam-bin.git
    skip_upload: auto
    depends: [ffmpeg, hicolor-icon-theme]
    optdepends:
      - "v4l2loopback-dkms: the loopback device that applications read"
      - "libnotify: desktop notifications"
    install: packaging/aur/gpwebcam.install
    commit_author:
      name: Darko Demić
      email: mail@darkodemic.com
    # The same files as the Arch package above, from the release archive.
    # The source package below installs them from the source tree; keep the
    # two lists in step.
    package: |-
      install -Dm755 gpwebcam "${pkgdir}/usr/bin/gpwebcam"
      install -Dm644 packaging/systemd/gpwebcam.service "${pkgdir}/usr/lib/systemd/user/gpwebcam.service"
      install -Dm644 packaging/modules-load.d/gpwebcam.conf "${pkgdir}/usr/lib/modules-load.d/gpwebcam.conf"
      install -Dm644 packaging/modprobe.d/99-gpwebcam.conf "${pkgdir}/usr/lib/modprobe.d/99-gpwebcam.conf"
      install -Dm644 packaging/desktop/gpwebcam.desktop "${pkgdir}/usr/share/applications/gpwebcam.desktop"
      install -Dm644 packaging/icons/gpwebcam.svg "${pkgdir}/usr/share/icons/hicolor/scalable/apps/gpwebcam.svg"
      install -Dm644 packaging/man/gpwebcam.1 "${pkgdir}/usr/share/man/man1/gpwebcam.1"
      install -Dm644 README.md "${pkgdir}/usr/share/doc/gpwebcam/README.md"
      install -Dm644 LICENSE "${pkgdir}/usr/share/licenses/gpwebcam/LICENSE"

aur_sources:
  - name: gpwebcam
    homepage: https://github.com/darkodemic/gpwebcam
    description: Use a GoPro connected over USB as a Linux webcam
    maintainers:
      - "Darko Demić <mail at darkodemic dot com>"
    license: Apache-2.0
    private_key: '{{ envOrDefault "AUR_KEY" "" }}'
    git_url: ssh://aur@aur.archlinux.org/gpwebcam.git
    skip_upload: auto
    makedepends: [go]
    conflicts: [gpwebcam-bin]
    depends: [ffmpeg, hicolor-icon-theme]
    optdepends:
      - "v4l2loopback-dkms: the loopback device that applications read"
      - "libnotify: desktop notifications"
    install: packaging/aur/gpwebcam.install
    commit_author:
      name: Darko Demić
      email: mail@darkodemic.com
    prepare: |-
      cd "${pkgname}-${pkgver}"
      go mod download
    build: |-
      cd "${pkgname}-${pkgver}"
      export CGO_CPPFLAGS="${CPPFLAGS}"
      export CGO_CFLAGS="${CFLAGS}"
      export CGO_CXXFLAGS="${CXXFLAGS}"
      export CGO_LDFLAGS="${LDFLAGS}"
      export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
      go build -ldflags "-linkmode=external -X main.version=${pkgver}" -o gpwebcam ./cmd/gpwebcam
    package: |-
      cd "${pkgname}-${pkgver}"
      install -Dm755 gpwebcam "${pkgdir}/usr/bin/gpwebcam"
      install -Dm644 packaging/systemd/gpwebcam.service "${pkgdir}/usr/lib/systemd/user/gpwebcam.service"
      install -Dm644 packaging/modules-load.d/gpwebcam.conf "${pkgdir}/usr/lib/modules-load.d/gpwebcam.conf"
      install -Dm644 packaging/modprobe.d/99-gpwebcam.conf "${pkgdir}/usr/lib/modprobe.d/99-gpwebcam.conf"
      install -Dm644 packaging/desktop/gpwebcam.desktop "${pkgdir}/usr/share/applications/gpwebcam.desktop"
      install -Dm644 packaging/icons/gpwebcam.svg "${pkgdir}/usr/share/icons/hicolor/scalable/apps/gpwebcam.svg"
      install -Dm644 packaging/man/gpwebcam.1 "${pkgdir}/usr/share/man/man1/gpwebcam.1"
      install -Dm644 README.md "${pkgdir}/usr/share/doc/gpwebcam/README.md"
      install -Dm644 LICENSE "${pkgdir}/usr/share/licenses/gpwebcam/LICENSE"

# The release notes are written by hand in docs/release-notes/ and passed
# with --release-notes (see CONTRIBUTING.md). GoReleaser reads that file in
# its changelog step, so the step stays enabled: changelog.disable skips it
# and the release gets empty notes, as 0.3.1 did.

# Published at once, not as a draft: the AUR packages above download from
# the release, so it has to be public when they are pushed.
release:
  github:
    owner: darkodemic
    name: gpwebcam
  draft: false
  # A tag such as v0.4.0-rc1 is a prerelease; the AUR skips it too.
  prerelease: auto
  # Running the release workflow again for a tag, after a failed AUR push,
  # replaces the files of the release it already published.
  replace_existing_artifacts: true
