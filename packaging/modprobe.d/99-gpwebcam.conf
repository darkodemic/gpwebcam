# v4l2loopback devices for gpwebcam, shipped by the gpwebcam package.
#
# Two devices: /dev/video42 "GoPro" for gpwebcam, and one more with a free
# number for OBS Virtual Camera, which uses the first loopback device that
# accepts output. exclusive_caps=1 makes browsers and Zoom accept them as
# cameras. gpwebcam finds its device by the "GoPro" label, not the number.
#
# modprobe adds up the options of all files, sorted by name, so this file
# overrides earlier ones such as RPM Fusion's 98-v4l2loopback.conf. To change
# it, put a file with the same name in /etc/modprobe.d/; a link to /dev/null
# turns it off. Changes take effect at the next boot, or when the module is
# reloaded while no program uses it.
options v4l2loopback devices=2 video_nr=42,-1 card_label="GoPro,OBS Virtual Camera" exclusive_caps=1,1
