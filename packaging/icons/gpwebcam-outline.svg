<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">gpwebcam outline</title>
  <desc id="desc">A simple monochrome action-camera icon with a front display, square lens housing, circular lens and five cooling ribs. Transparent background.</desc>
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body contour joins the raised lens housing. -->
    <path d="M130 59H38a18 18 0 0 0-18 18v109a18 18 0 0 0 18 18h180a18 18 0 0 0 18-18v-48" stroke-width="8"/>
    <!-- Front display panel and status light. -->
    <rect x="37" y="77" width="76" height="109" rx="8" stroke-width="5"/>
    <path d="M70 86h10" stroke-width="4"/>
    <!-- Replaceable square lens cover. -->
    <rect x="131" y="51" width="105" height="104" rx="18" stroke-width="8"/>
    <circle cx="183.5" cy="103" r="33" stroke-width="5"/>
    <!-- Front cooling ribs. -->
    <path d="M145 167v20m18-20v20m18-20v20m18-20v20m18-20v20" stroke-width="5"/>
  </g>
  <g fill="currentColor">
    <rect x="45" y="96" width="60" height="61" rx="3"/>
    <circle cx="183.5" cy="103" r="23"/>
    <!-- Four-block mark simplified for small sizes. -->
    <rect x="48" y="170" width="10" height="8" rx="1"/>
    <rect x="63" y="170" width="10" height="8" rx="1"/>
    <rect x="78" y="170" width="10" height="8" rx="1"/>
    <rect x="93" y="170" width="10" height="8" rx="1"/>
  </g>
</svg>
