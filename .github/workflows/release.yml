# Builds and publishes a release when a version tag (v0.1.0, ...) is
# pushed, with the Go and GoReleaser versions from mise.toml. GoReleaser
# publishes the GitHub release with the packages, archives, checksums and
# the notes from docs/release-notes/<version>.md, then pushes gpwebcam and
# gpwebcam-bin to the AUR with the key from the environment's AUR_KEY, and
# gpwebcam-git when its recipe changed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    # Holds AUR_KEY; it allows only tags v*.
    environment: Arch Linux User Repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Find the release notes
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME#v}.md"
          test -s "$notes" || { echo "::error::missing $notes"; exit 1; }
          echo "NOTES=$notes" >> "$GITHUB_ENV"
      - run: goreleaser release --clean --release-notes "$NOTES"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
      # gpwebcam-git builds the newest commit by itself, so its recipe goes
      # to the AUR only when it changed. Prereleases skip it, like the
      # other AUR packages.
      - name: Update gpwebcam-git on the AUR
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$AUR_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -F /dev/null"
          dir=$(mktemp -d)
          git clone ssh://aur@aur.archlinux.org/gpwebcam-git.git "$dir"
          cp packaging/aur/gpwebcam-git/PKGBUILD packaging/aur/gpwebcam-git/.SRCINFO packaging/aur/gpwebcam.install "$dir"/
          git -C "$dir" add PKGBUILD .SRCINFO gpwebcam.install
          if git -C "$dir" diff --cached --quiet; then
            echo "gpwebcam-git on the AUR is up to date"
          else
            git -C "$dir" -c user.name="Darko Demić" -c user.email="mail@darkodemic.com" commit -m "Update the PKGBUILD ($GITHUB_REF_NAME)"
            git -C "$dir" push origin HEAD:master
          fi
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
      # GoReleaser published empty notes once without saying so.
      - name: Check the published notes
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
          test -n "${body//[[:space:]]/}" || { echo "::error::the release has no notes; add them with gh release edit --notes-file $NOTES"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
