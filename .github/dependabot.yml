# Keeps the commit-pinned GitHub Actions and the Go module dependencies
# (the tray icon's github.com/darkodemic/systray and godbus) current: at
# most one pull request a month for each. The systray fork has tagged
# releases since v1.13.0, so its new releases come as pull requests too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
