# Keeps the commit-pinned GitHub Actions and the Go module dependencies
# (the tray icon's fyne.io/systray and godbus) current: at most one pull
# request a month for each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
